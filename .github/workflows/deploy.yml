name :  Deploy to Github Pages
on:
  push: 
    branches: [main]      # push to branch "main"
  workflow_dispatch: 

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
    group: 'pages'
    cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4       # checkout the repository
      - uses: actions/configure-pages@v4        # configure GitHub Pages
      - uses: actions/setup-node@v4     # setup node
        with:
          node-version: '26'
          cache: 'npm'
      - run: npm ci                     # install dependencies
      - run: npm run build              # build the project
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist                    # path to the build output directory
  deploy:
    needs: build                        # require the build job to complete first
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
